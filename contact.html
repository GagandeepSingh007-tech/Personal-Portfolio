<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Gagandeep Singh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="container nav-wrapper">
      <a href="index.html" class="brand">Gagandeep Singh</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 60px;">
    <h1>Get in Touch</h1>
    <p>Feel free to reach out for inquiries or freelance writing collaborations.</p>

    <form style="margin-top: 30px; max-width: 500px;">
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 0.9rem; margin-bottom: 6px; font-weight: 500;">Name</label>
        <input type="text" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 0.9rem; margin-bottom: 6px; font-weight: 500;">Email</label>
        <input type="email" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 0.9rem; margin-bottom: 6px; font-weight: 500;">Message</label>
        <textarea rows="5" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required></textarea>
      </div>

      <button type="submit" class="btn" style="border: none; cursor: pointer;">Send Message</button>
    </form>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 Gagandeep Singh.</p>
    </div>
  </footer>

</body>
</html>
